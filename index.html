<!DOCTYPE html>
<html>
<head>
    <title>Live Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { max-width: 90%; max-height: 90%; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <video id="video" controls autoplay></video>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'http://37.1.205.83:8080/live/test.m3u8';
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
