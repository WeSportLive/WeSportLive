        .hide-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 70% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

        /* Background Floating Animation */
        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.8); opacity: 0; }

        .dark @keyframes float-up { 10% { opacity: 0.15; } 90% { opacity: 0.15; } }

        .match-card { width: 100%; border-radius: var(--card-radius); transition: transform .2s, box-shadow .2s; cursor: pointer; border: 1px solid rgba(0,0,0,.05); }

        .match-card { background: linear-gradient(145deg, #ffffff, #f8fafc); }
        .match-card:active{ transform: scale(.98); }

        .match-card.live-card { border-color: rgba(239,68,68,.4); }
        .dark .match-card.live-card { box-shadow: 0 0 0 1px rgba(239,68,68,.3), 0 4px 15px -4px rgba(239,68,68,.2); }

        .finished-match-card { width: 100%; border-radius: 12px; transition: transform .2s; cursor: pointer; padding: 10px 14px !important; margin-bottom: 2px; }
        .dark .finished-match-card { background: linear-gradient(145deg, rgba(30,41,59,.6), rgba(15,23,42,.8)); border: 1px solid rgba(255,255,255,.05); }
        .finished-match-card { background: linear-gradient(145deg, #f8fafc, #ffffff); border: 1px solid rgba(0,0,0,.05); }
        .finished-match-card:active{ transform: scale(.98); }

        /* Unified Glass/Service Cards */
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(226, 232, 240, 0.8); transition: transform 0.2s; }
        .dark .glass-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); }
        .glass-card:active { transform: scale(.98); }

        /* Countdown */
        .countdown-wrap { display: flex; gap: 6px; justify-content: center; font-variant-numeric: tabular-nums; }
        .countdown-unit { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 4px 8px; min-width: 40px; }
